name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: casafro
          POSTGRES_PASSWORD: casafro
          POSTGRES_DB: casafro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casafro" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - run: npm run typecheck
      - name: Testes (PostgreSQL embutido)
        run: npm test
      - name: Testes (servidor PostgreSQL 16)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://casafro:casafro@localhost:5432/casafro
      - name: Build de produção
        run: npm run build
        env:
          DATABASE_URL: postgres://casafro:casafro@localhost:5432/casafro
